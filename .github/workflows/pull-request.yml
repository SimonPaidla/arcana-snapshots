# Judges a contribution before it can be merged.
#
# This is the check the branch ruleset on main requires. Whatever passes
# here lands in the shared archive, and the archive is the one thing in
# this project that cannot be obtained again - a price from yesterday is
# gone once it is gone. scripts/check-pr.js is therefore written to refuse
# anything it was not explicitly built to accept: new files directly under
# snapshots/, named after their timestamp, and nothing else.
#
# That refusal is also what makes it safe for the game-data workflow to
# write to main directly. The only way to change what an action does is to
# change a file under .github/, and a pull request that touches anything
# outside snapshots/*.json is rejected here.
name: Pull request

on:
  pull_request:
    branches: [main]

# Read-only. This job judges; it does not change anything.
permissions:
  contents: read

concurrency:
  # A second push to the same pull request makes the first run pointless.
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares the contribution against the whole archive,
          # so it needs the history rather than a shallow copy.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the contribution
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr.js
