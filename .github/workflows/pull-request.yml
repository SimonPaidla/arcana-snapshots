# Judges a pull request into main; its job `validate` is the check the
# ruleset on main requires, pinned to GitHub Actions as its source. A check
# of that name from any other workflow - one a branch of this repository
# brings along - is no judgement: the ruleset also requires a code owner's
# review for everything outside snapshots/, items/ and gamedata/
# (.github/CODEOWNERS).
#
# Runs on pull_request_target: the workflow and scripts/ are main's, the
# pull request's commits are fetched as data, and nothing of the pull
# request is executed. scripts/check-pr.js reads its files with git and
# accepts new files of one crawl time under snapshots/ and items/, or a
# build of the game data under gamedata/ on its own. `edited` judges a
# pull request again when its base branch changes.
#
# Fetched: main with its history (the merge base and the archive), the pull
# request's head, and the newest commit of the gamedata branch - no other
# branch. Actions are pinned by commit.
name: Pull request

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # main's newest commit: the workflow's scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # main's history, the pull request's commits and the published game
      # data, without a checkout.
      - name: Fetch what the check reads
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --unshallow origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
          git fetch --no-tags --depth=1 origin "+refs/heads/gamedata:refs/remotes/origin/gamedata" || echo "No gamedata branch."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check the contribution
        env:
          BASE_REF: HEAD
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr.js
