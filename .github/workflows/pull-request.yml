# Judges a pull request into main; `validate` is the check the ruleset on
# main requires.
#
# Runs on pull_request_target: the workflow and scripts/ are main's, the
# pull request's commits are fetched as data, and nothing of the pull
# request is executed. scripts/check-pr.js reads its files with git and
# accepts new files under snapshots/ and items/ only.
name: Pull request

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # main, with its history: the archive the contribution is compared to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      # The pull request's commits, without a checkout.
      - name: Fetch the pull request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the contribution
        env:
          BASE_REF: HEAD
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr.js
