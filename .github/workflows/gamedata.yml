# Publishes the game data on the gamedata branch, where Arcana reads it.
#
# A build arrives as a pull request into main that writes gamedata/
# (scripts/check-pr.js judges it). Once it is merged, this workflow runs
# nothing but scripts/publish-gamedata.sh, which judges the build again
# against the published one and commits it to the gamedata branch when a
# file changed.
name: Game data

on:
  push:
    branches: [main]
    paths: ['gamedata/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamedata
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/publish-gamedata.sh gamedata gamedata
