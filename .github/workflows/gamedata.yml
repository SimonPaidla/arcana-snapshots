# Copies the build of the game data on main (gamedata/) to the gamedata
# branch, for installations of Arcana that read it there. Arcana and Arcana
# Crawler read gamedata/ on main itself; this workflow goes once no
# installation reads the branch any more (README.md, Game data).
#
# A build arrives as a pull request into main that writes gamedata/
# (scripts/check-pr.js judges it). Once it is merged, the job `publish`
# runs three steps:
#   1. a refusal of every ref but refs/heads/main - a manual run from
#      another branch, or this file on another branch, publishes nothing;
#   2. actions/checkout, pinned by commit, of main - with the deploy key of
#      the environment `publish-gamedata` (secret GAMEDATA_DEPLOY_KEY) where
#      it has one, the one writer the ruleset on the gamedata branch lets
#      through; else with this job's token;
#   3. scripts/publish-gamedata.sh on the runner's own Node, which judges
#      the build again against the published one and commits it to the
#      gamedata branch when a file changed.
name: Game data

on:
  push:
    branches: [main]
    paths: ['gamedata/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamedata
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its secret is only given to a job on main (deployment branches: main).
    environment: publish-gamedata
    permissions:
      contents: write

    steps:
      - name: Refuse any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The game data is published from refs/heads/main only."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}

      - name: Publish if anything changed
        run: |
          node --version
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/publish-gamedata.sh gamedata gamedata
