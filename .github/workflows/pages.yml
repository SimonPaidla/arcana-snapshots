# Builds index.json, series.json and latest.json from the archive
# (scripts/build-index.js) and publishes them on GitHub Pages. Nothing is
# committed.
name: Pages

on:
  push:
    branches: [main]
    paths: ['snapshots/**', 'items/**']
  workflow_dispatch:
  schedule:
    # Rebuilds every six hours besides the pushes.
    - cron: '43 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, none cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the index
        run: node scripts/build-index.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deploy
        uses: actions/deploy-pages@v4
