# Builds index.json, recent.json, series.json and latest.json from the
# archive (scripts/build-index.js) and publishes them on GitHub Pages.
# Nothing is committed. Actions are pinned by commit.
name: Pages

on:
  push:
    branches: [main]
    paths: ['snapshots/**', 'items/**']
  workflow_dispatch:
  schedule:
    # Rebuilds every six hours besides the pushes.
    - cron: '43 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, none cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build the index
        run: node scripts/build-index.js

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
